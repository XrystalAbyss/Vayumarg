[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vayumarg"
version = "0.1.0"
description = "Vayumarg - AI/ML Decision-Support System for Tropical Cyclone Identification, Classification, Intensity Estimation and Forecasting"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Team VortexA - SIH 2026" }
]
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "geoalchemy2>=0.14.0",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
    "shapely>=2.0.4",
    "h5py>=3.16.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
vayumarg = "vayumarg.api.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vayumarg"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # function call in argument defaults (standard in typer/fastapi)
    "E501",  # line length handled by ruff format
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Pure unit tests without external database dependencies",
    "integration: Integration tests requiring PostgreSQL/PostGIS",
]
